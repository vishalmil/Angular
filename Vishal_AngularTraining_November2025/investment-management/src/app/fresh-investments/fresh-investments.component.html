<div class="form-container">
    <h2>Add Fresh Investment</h2>
    <form [formGroup]="investmentForm" (ngSubmit)="onSubmit()">
        <!-- <div>
            <label >ID:</label>
            <input type="number" formControlName="id"/>
        </div> -->

        <div>
            <label >Name:</label>
            <input type="text" formControlName="name"/>
        </div>

        <div>
            <label >Type:</label>
            <select formControlName="type">
                <option value="">Select Type</option>
                <option value="Equity">Equity</option>
                <option value="Debt">Debt</option>
                <option value="Mutual Fund">Mutual Fund</option>
            </select>
        </div>

        <div>
            <label >Amount:</label>
            <input type="number" formControlName="amount"/>
        </div>

        <div>
            <label >Purchase Date:</label>
            <input type="date" formControlName="purchaseDate"/>
        </div>

        <div>
            <label >Current Value:</label>
            <input type="number" formControlName="currentValue"/>
        </div>

        <button type="submit" >Add Investment</button>
    </form>

    <!-- General form-level error message -->
    <div *ngIf="investmentForm.invalid && investmentForm.touched" class="error">
        Please fill out all fields correctly.
    </div>
</div>
