<div>
    <fieldset>
        <legend>Add New Product</legend>
        <form>
            <label for="productId">Product Id:</label>
            <input type="number" id="productId" [(ngModel)]="productElement.id" name="id"><br><br>
            <label for="productName">Product Name:</label>
            <input type="text" id="productName" [(ngModel)]="productElement.name" name="name"><br><br>
            <label for="productId">Product Price:</label>
            <input type="number" id="productPrice" [(ngModel)]="productElement.price" name="price"><br><br>
            <input type="submit" (click)="addProductDetails();" value="Add Product">
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <button type="reset">Clear Form</button>
        </form>
    </fieldset>
</div>
